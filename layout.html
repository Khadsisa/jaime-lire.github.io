{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'main/css/main.css'%}">
    <link rel="stylesheet" href = "https://use.fontawesome.com/releases/v7.1.0/css/all.css">
</head>
<body>
    <aside>
        <img src="{% static 'main/img/capucen.jpg' %}" alt="Капучинка">
        <span class="aesthetic">Кофейня j'aime lire</span>
        <h3>С заботой о вас:</h3>
        <ul>
            <a href = "{% url 'home' %}" style="text-decoration: none;"><li><i class="fa-regular fa-house" style="color: #6d4d09;"></i>Главная</li></a>
            <a href = "{% url 'about' %}" style="text-decoration: none;"><li><i class="fa-solid fa-trophy" style="color: #FFD43B;"></i>История кофейни</li></a>
            <a href = "{% url 'news_home' %}" style="text-decoration: none;"><li><i class="fa-solid fa-bell" style="color: #FFD43B;"></i>Новинки</li></a>
            <a href = "{% url 'create' %}" ><li><button type="button" class="btn btn-outline-light">Добавить запись</button></li></a>
        </ul>
    </aside>
    <main>
        {% block content %}
            <style>
                а {
                    text-decoration: none;
                }
            </style>
        {% endblock%}
    </main>
</body>
</html>
